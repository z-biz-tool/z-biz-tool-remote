name: Build Tauri Client (multi-platform)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    defaults:
      run:
        working-directory: z-biz-tool-remote-client
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            label: macOS-ARM
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            label: macOS-Intel
          - platform: ubuntu-22.04
            args: ''
            label: Linux
          - platform: windows-latest
            args: ''
            label: Windows

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: z-biz-tool-remote-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Workaround: GitHub's new token format (2026-08) corrupts the cargo config
      # that dtolnay/rust-toolchain writes, breaking later cargo invocations.
      - name: Reset broken cargo config
        shell: bash
        run: rm -f "$HOME/.cargo/config.toml" "$USERPROFILE/.cargo/config.toml"

      - name: Build Tauri (all targets)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx @tauri-apps/cli build ${{ matrix.args }} --bundles app,dmg,deb,appimage,msi,nsis

      - name: Locate artifacts
        id: locate
        run: |
          set -e
          ART_DIR=src-tauri/target/release/bundle
          APP=$(find "$ART_DIR/macos" -maxdepth 1 -name "*.app" 2>/dev/null | head -n1 || true)
          DMG=$(find "$ART_DIR/dmg" -maxdepth 2 -name "*.dmg" 2>/dev/null | head -n1 || true)
          DEB=$(find "$ART_DIR/deb" -maxdepth 2 -name "*.deb" 2>/dev/null | head -n1 || true)
          APPIMAGE=$(find "$ART_DIR/appimage" -maxdepth 2 -name "*.AppImage" 2>/dev/null | head -n1 || true)
          MSI=$(find "$ART_DIR/msi" -maxdepth 2 -name "*.msi" 2>/dev/null | head -n1 || true)
          NSIS=$(find "$ART_DIR/nsis" -maxdepth 2 -name "*.exe" 2>/dev/null | head -n1 || true)
          echo "app=$APP" >> $GITHUB_OUTPUT
          echo "dmg=$DMG" >> $GITHUB_OUTPUT
          echo "deb=$DEB" >> $GITHUB_OUTPUT
          echo "appimage=$APPIMAGE" >> $GITHUB_OUTPUT
          echo "msi=$MSI" >> $GITHUB_OUTPUT
          echo "nsis=$NSIS" >> $GITHUB_OUTPUT

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          path: |
            ${{ steps.locate.outputs.app }}
            ${{ steps.locate.outputs.dmg }}
            ${{ steps.locate.outputs.deb }}
            ${{ steps.locate.outputs.appimage }}
            ${{ steps.locate.outputs.msi }}
            ${{ steps.locate.outputs.nsis }}
          if-no-files-found: warn

  release:
    name: Attach to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Flatten artifact folders
        run: |
          for d in dist/*/; do
            [ -d "$d" ] && find "$d" -type f -exec mv -n {} dist/ \;
          done

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: false
          generate_release_notes: true
          draft: false
