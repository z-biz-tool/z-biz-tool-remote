name: CI

# 这条 workflow 原本是"仓库根当 npm 项目"写的，而这个仓根本没有根 package.json：
# npm ci 在根目录必然失败，docker build 也找不到 Dockerfile（它在 z-biz-tool-remote-server/ 里），
# 所以 main 上的 CI 连红三次（8f4e5bc / 33b67e0 / b086d92），红得跟任何人的改动都无关。
# 这里把它改成"真正存在的两个包各跑自己的门禁"，push 到 main 即跑；出包仍归 build-*.yml（tag 触发）。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支新 push 取消旧 run：并行会话直推 main 时不排队烧 runner。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 只读代码，不建 release、不推镜像。
permissions:
  contents: read

jobs:
  server:
    name: 服务端 e2e（node + ws）
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: z-biz-tool-remote-server
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # server 目录只有 package.json、没有锁文件，npm ci 会直接报错；先用 install 把门禁跑起来，
      # 补锁文件是另一件事（会改依赖解析口径）。
      - name: Install dependencies
        run: npm install --registry=https://registry.npmmirror.com

      # 原来的 matrix 用 node 20/22 各跑一遍：runner 已经在把 Node 20 强制升到 24 跑，
      # 那条腿量不到 20 的行为，只会留下 deprecation 警告。改成一条 22（本仓 engines 要 >=18）。
      - name: Run e2e tests
        run: npm test

  client:
    name: 客户端 typecheck + 构建
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: z-biz-tool-remote-client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # 缓存键必须指到真实存在的锁文件；原先写的 package-lock.json 在仓库根，
          # setup-node 因此报 "Some specified paths were not resolved, unable to cache dependencies"。
          cache-dependency-path: z-biz-tool-remote-client/package-lock.json

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmmirror.com

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        # build 脚本自带 tsc --noEmit，之后是 vite build；这里要的是"打包真的能过"，
        # 而不只是类型能过。
        run: npm run build

  docker:
    name: 镜像构建 + 健康检查
    runs-on: ubuntu-22.04
    needs: server
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        # Dockerfile 在 server 子目录，构建上下文也必须是那个目录：
        # 原来的 `docker build -t ... .` 在仓库根找 Dockerfile，第一步就失败。
        run: docker build -t z-biz-tool-remote-server:ci z-biz-tool-remote-server

      - name: Smoke test container
        run: |
          AUTH_TOKEN=$(openssl rand -hex 32)
          CID=$(docker run -d -e AUTH_TOKEN -p 8080:8080 z-biz-tool-remote-server:ci)
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz
          docker rm -f $CID >/dev/null
