<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>远程协同</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <div id="main-panel">
            <div class="header">
                <div class="header-left">
                    <h1 id="app-title">远程协同</h1>
                    <p id="app-subtitle">安全、高效的远程控制工具</p>
                </div>
                <div class="header-right">
                    <div class="language-switch">
                        <select id="language-select">
                            <option value="zh">中文</option>
                            <option value="en">English</option>
                        </select>
                    </div>
                    <span id="connection-status" class="status offline">离线</span>
                </div>
            </div>

            <div class="device-info">
                <h3 id="label-device-id">设备 ID</h3>
                <div id="device-id" class="device-id">Loading...</div>
                <button id="copy-device-id" class="btn btn-secondary">复制</button>
            </div>

            <div class="section">
                <h3 id="label-quick-actions">快捷操作</h3>
                <button id="create-session" class="btn btn-primary">创建会话</button>
                <button id="get-devices" class="btn btn-secondary">刷新设备</button>
            </div>

            <div class="section">
                <h3 id="label-join-session">加入会话</h3>
                <div class="form-group">
                    <label id="label-session-id">会话 ID</label>
                    <input type="text" id="session-id" placeholder="输入会话 ID">
                </div>
                <div class="form-group">
                    <label id="label-session-token">会话令牌</label>
                    <input type="text" id="session-token" placeholder="输入会话令牌">
                </div>
                <button id="join-session" class="btn btn-primary">加入会话</button>
            </div>

            <div class="section">
                <h3 id="label-online-devices">在线设备</h3>
                <div id="devices-list" class="devices-list">未找到设备</div>
            </div>

            <div class="section">
                <h3 id="label-history">历史记录</h3>
                <div class="history-tabs">
                    <button id="tab-devices" class="tab-btn active">设备</button>
                    <button id="tab-sessions" class="tab-btn">会话</button>
                </div>
                <div id="history-content" class="history-content">
                    <div id="history-devices" class="history-panel">暂无历史记录</div>
                    <div id="history-sessions" class="history-panel hidden">暂无历史记录</div>
                </div>
                <button id="clear-history" class="btn btn-danger btn-sm">清空历史</button>
            </div>

            <div class="section">
                <h3 id="label-session-info">会话信息</h3>
                <div id="session-info" class="session-info">
                    <p>无活动会话</p>
                </div>
            </div>

            <div class="section">
                <h3 id="label-settings">设置</h3>
                <div class="form-group">
                    <label id="label-frame-quality">画面质量: <span id="quality-value">80</span>%</label>
                    <input type="range" id="frame-quality" min="10" max="100" value="80">
                </div>
                <div class="form-group">
                    <label id="label-fps">帧率: <span id="fps-value">15</span></label>
                    <input type="range" id="fps" min="1" max="30" value="15">
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="auto-connect" checked>
                        <span id="label-auto-connect">自动连接</span>
                    </label>
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="save-history" checked>
                        <span id="label-save-history">保存历史记录</span>
                    </label>
                </div>
            </div>

            <div class="section">
                <h3 id="label-security">安全设置</h3>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="require-permission" checked>
                        <span id="label-require-permission">需要权限确认</span>
                    </label>
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="allow-file-transfer" checked>
                        <span id="label-allow-file-transfer">允许文件传输</span>
                    </label>
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="allow-clipboard" checked>
                        <span id="label-allow-clipboard">允许剪贴板同步</span>
                    </label>
                </div>
                <div id="trusted-devices" class="trusted-devices">
                    <h4 id="label-trusted-devices">信任设备</h4>
                    <div id="trusted-list" class="trusted-list">暂无信任设备</div>
                </div>
            </div>

            <div class="footer">
                <p>服务器: ws://101.37.80.51:8080</p>
            </div>
        </div>

        <div id="control-panel" class="hidden">
            <div class="header">
                <h2 id="control-title">远程视图</h2>
                <button id="close-control" class="btn btn-danger">关闭</button>
            </div>
            <div class="screen-container">
                <canvas id="screen-canvas"></canvas>
                <div id="screen-placeholder" class="placeholder">
                    <p>等待屏幕数据...</p>
                </div>
            </div>
            <div class="control-bar">
                <button id="send-clipboard" class="btn btn-secondary">同步剪贴板</button>
                <button id="send-file" class="btn btn-secondary">发送文件</button>
                <input type="file" id="file-input" class="hidden">
                <span id="control-mode" class="mode-badge">仅查看</span>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
