<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E7CF6"/>
      <stop offset="1" stop-color="#00B4D8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7FF9E8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#7FF9E8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="72" y="72" width="880" height="880" rx="232" fill="url(#bg)"/>

  <!-- 三段遥控/投屏波纹 -->
  <path d="M183 470 A380 380 0 0 1 841 470"
        fill="none" stroke="#7FF9E8" stroke-opacity="0.75" stroke-width="40" stroke-linecap="round"/>
  <path d="M278 525 A270 270 0 0 1 746 525"
        fill="none" stroke="#F2F7FA" stroke-opacity="0.9" stroke-width="44" stroke-linecap="round"/>
  <path d="M373 580 A160 160 0 0 1 651 580"
        fill="none" stroke="#FFFFFF" stroke-width="48" stroke-linecap="round"/>

  <!-- 发射点 -->
  <circle cx="512" cy="660" r="150" fill="url(#glow)"/>
  <circle cx="512" cy="660" r="72" fill="#FFFFFF"/>
  <circle cx="512" cy="660" r="40" fill="#34E8D2"/>
</svg>
